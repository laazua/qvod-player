[workspace]
resolver = "2"
members = [
    "crates/qvs-core",
    "crates/qvs-format",
    "crates/qvs-dht",
    "crates/qvs-tracker",
    "crates/qvs-transport",
    "crates/qvs-stream",
    "crates/qvs-local-server",
    "crates/qvs-media",
    "crates/qvs-gui",
    "server",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "1"
sha1 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
hyper = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
bitvec = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "5"
zstd = "0.13"
lru = "0.12"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
